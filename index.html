<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b3d5c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>قائمة رحلة اللاذقية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { touch-action: manipulation; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(160deg, #0b3d5c 0%, #1b6ca8 45%, #38b6d8 100%); min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 14px) 14px calc(96px + env(safe-area-inset-bottom)) 14px; }
        .container { max-width: 720px; margin: 0 auto; }

        h1 { text-align: center; color: #fff; font-size: 1.45rem; margin-bottom: 5px; text-shadow: 0 2px 8px rgba(0,0,0,0.25); }
        .subtitle { text-align: center; color: rgba(255,255,255,0.85); font-size: 0.82rem; margin-bottom: 16px; }

        .progress-wrap { margin-bottom: 14px; padding: 0 4px; }
        .progress-top { display: flex; justify-content: space-between; color: #fff; font-size: 0.85rem; margin-bottom: 6px; font-weight: 600; }
        .progress-bar { height: 12px; background: rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #28a745, #8eda3a); border-radius: 10px; transition: width 0.4s ease; }

        .card { background: rgba(255,255,255,0.96); border-radius: 14px; padding: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.2); margin-bottom: 12px; }

        .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        .search { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border: 2px solid #d3dde6; border-radius: 22px; outline: none; font-size: 16px; background: #fff; }
        .search:focus { border-color: #1b6ca8; }

        .toolbar-actions { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 6px; margin-bottom: 8px; }
        .tool-btn { height: 52px; border: none; border-radius: 10px; font-size: 0.78rem; font-weight: 600; cursor: pointer; background: #eef3f7; color: #1b6ca8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
        .tool-btn .ico { font-size: 1.15rem; line-height: 1; }
        .tool-btn:active { transform: scale(0.96); }
        .tool-btn.danger { background: #fdecea; color: #b02a37; }
        .tool-btn.active { background: #1b6ca8; color: #fff; }

        .cat-filter { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .cat-filter::-webkit-scrollbar { display: none; }
        .chip { flex-shrink: 0; padding: 9px 16px; border-radius: 20px; border: none; cursor: pointer; font-size: 0.82rem; font-weight: 600; transition: transform 0.15s; }
        .chip:active { transform: scale(0.94); }

        .list { list-style: none; }
        .item { display: flex; align-items: center; gap: 10px; background: #fff; padding: 13px 12px; border-radius: 12px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-right: 4px solid #ccc; transition: opacity 0.25s; animation: slideIn 0.25s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
        .item.checked { opacity: 0.6; }
        .item.checked .item-text { text-decoration: line-through; color: #888; }
        .item input[type="checkbox"] { width: 24px; height: 24px; accent-color: #28a745; cursor: pointer; flex-shrink: 0; min-width: 24px; }
        .item .item-main { flex: 1; min-width: 0; }
        .item-text { display: block; font-size: 1rem; word-break: break-word; }
        .item-catrow { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
        .cat-tag { font-size: 0.66rem; font-weight: 700; color: #555; background: #f0f2f5; border-radius: 10px; padding: 2px 9px; white-space: nowrap; }
        .edit-inline { width: 100%; padding: 8px 10px; border: 2px solid #1b6ca8; border-radius: 8px; font-size: 16px; outline: none; }
        .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .item-actions button { width: 42px; height: 42px; border: none; border-radius: 10px; cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; }
        .btn-edit { background: #fff3cd; }
        .btn-del { background: #fdecea; }
        .btn-edit:active, .btn-del:active { transform: scale(0.92); }

        .empty { text-align: center; color: #888; padding: 26px 10px; font-size: 0.95rem; }
        .quote { text-align: center; font-size: 0.9rem; color: #fff; margin-top: 14px; font-style: italic; }

        .add-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(255,255,255,0.97); box-shadow: 0 -4px 18px rgba(0,0,0,0.15); display: flex; gap: 8px; z-index: 50; }
        .add-bar input[type="text"] { flex: 1; min-width: 0; height: 50px; padding: 0 14px; border: 2px solid #d3dde6; border-radius: 10px; font-size: 16px; outline: none; background: #fff; }
        .add-bar input[type="text"]:focus { border-color: #1b6ca8; }
        .add-bar select { height: 50px; max-width: 104px; padding: 0 8px; border: 2px solid #d3dde6; border-radius: 10px; font-size: 14px; background: #fff; outline: none; }
        .btn-add { height: 50px; padding: 0 20px; width: 92px; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 700; cursor: pointer; background: #28a745; color: #fff; }
        .btn-add:active { transform: scale(0.95); }

        .toast { position: fixed; bottom: calc(96px + env(safe-area-inset-bottom)); right: 50%; transform: translateX(50%) translateY(100px); background: #203a43; color: #fff; padding: 12px 22px; border-radius: 10px; opacity: 0; transition: all 0.3s; z-index: 99; font-size: 0.95rem; box-shadow: 0 4px 18px rgba(0,0,0,0.3); white-space: nowrap; max-width: 90vw; }
        .toast.show { opacity: 1; transform: translateX(50%) translateY(0); }

        @media (min-width: 601px) {
            .toolbar-actions { grid-template-columns: repeat(4, auto); }
            .tool-btn { flex-direction: row; gap: 6px; height: 44px; padding: 0 14px; }
            .tool-btn .ico { font-size: 1rem; }
            .item-actions button { width: auto; padding: 0 12px; gap: 4px; font-size: 0.8rem; }
            .item-catrow { margin-top: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏖️ قائمة رحلة اللاذقية</h1>
        <div class="subtitle">جهّز شنطتك وخلينا نروح! 🎒</div>

        <div class="progress-wrap">
            <div class="progress-top"><span>التقدم</span><span id="progressLabel">0/0</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>

        <div class="card">
            <div class="toolbar">
                <input type="text" class="search" id="searchInput" placeholder="🔍 بحث..." oninput="render()">
            </div>

            <div class="toolbar-actions">
                <button class="tool-btn" id="editModeBtn" onclick="toggleEditMode()"><span class="ico">✏️</span><span>تعديل</span></button>
                <button class="tool-btn" onclick="exportData()"><span class="ico">📁</span><span>تصدير</span></button>
                <button class="tool-btn" onclick="importData()"><span class="ico">📥</span><span>استيراد</span></button>
                <button class="tool-btn danger" onclick="clearDone()"><span class="ico">🧹</span><span>المكتمل</span></button>
            </div>

            <div class="cat-filter" id="catFilter">
                <button class="chip active" data-cat="all" onclick="setCatFilter('all', this)" style="background:#1b6ca8;color:#fff;">الكل</button>
            </div>

            <ul class="list" id="list"></ul>
            <div class="empty" id="emptyBox">لا يوجد عناصر بعد — أضف أول عنصر! 🎒</div>
        </div>

        <div class="quote" id="quote"></div>
        <div class="toast" id="toast"></div>
    </div>

    <div class="add-bar">
        <input type="text" id="itemInput" placeholder="اكتب عنصر جديد..." onkeydown="if(event.key==='Enter')addItem()">
        <select id="catSelect">
            <option value="عام">عام</option>
            <option value="ملابس">ملابس</option>
            <option value="مستندات">مستندات</option>
            <option value="إلكترونيات">إلكترونيات</option>
            <option value="أغراض شخصية">أغراض شخصية</option>
        </select>
        <button class="btn-add" onclick="addItem()">إضافة</button>
    </div>

    <script>
        const COLORS = { 'عام': '#6c757d', 'ملابس': '#e83e8c', 'مستندات': '#fd7e14', 'إلكترونيات': '#007bff', 'أغراض شخصية': '#28a745' };

        let items = JSON.parse(localStorage.getItem('latItems_v2') || '[]');
        let catFilter = 'all';
        let editMode = false;

        function save() { localStorage.setItem('latItems_v2', JSON.stringify(items)); }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2000);
        }

        function buildCatChips() {
            const cats = [...new Set(items.map(i => i.cat))];
            const wrap = document.getElementById('catFilter');
            wrap.innerHTML = `<button class="chip active" data-cat="all" onclick="setCatFilter('all', this)" style="background:#1b6ca8;color:#fff;">الكل</button>` +
                cats.map(c => `<button class="chip" data-cat="${c}" onclick="setCatFilter('${c}', this)" style="background:${COLORS[c]||'#888'};color:#fff;">${esc(c)}</button>`).join('');
            if (catFilter !== 'all' && !cats.includes(catFilter)) catFilter = 'all';
            document.querySelectorAll('.chip').forEach(ch => { if (ch.dataset.cat === catFilter) ch.classList.add('active'); });
        }

        function render() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            buildCatChips();
            const list = document.getElementById('list');
            const empty = document.getElementById('emptyBox');
            const filtered = items.filter(i =>
                (catFilter === 'all' || i.cat === catFilter) &&
                (!search || i.text.toLowerCase().includes(search))
            );

            if (!filtered.length) {
                empty.style.display = 'block';
                list.innerHTML = '';
            } else {
                empty.style.display = 'none';
                const sorted = [...filtered].sort((a, b) => a.done - b.done);
                list.innerHTML = sorted.map(item => {
                    const idx = items.indexOf(item);
                    return `<li class="item ${item.done ? 'checked' : ''}" style="border-right-color:${COLORS[item.cat]||'#ccc'}">
                        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggle(${idx})">
                        <div class="item-main">
                            ${editMode ? `<input type="text" class="edit-inline" value="${esc(item.text)}" onchange="updateInline(${idx}, this.value)">`
                                      : `<span class="item-text">${esc(item.text)}</span>`}
                            <div class="item-catrow"><span class="cat-tag">${esc(item.cat)}</span></div>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit" onclick="editItem(${idx})" title="تعديل">✏️</button>
                            <button class="btn-del" onclick="delItem(${idx})" title="حذف">🗑️</button>
                        </div>
                    </li>`;
                }).join('');
            }

            const done = items.filter(i => i.done).length;
            const pct = items.length ? Math.round(done / items.length * 100) : 0;
            document.getElementById('progressLabel').textContent = items.length ? `${done}/${items.length}` : '0/0';
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('quote').textContent = done === items.length && items.length > 0 ? 'ممتاز! الشنطة جاهزة 🎉' : '';
        }

        function addItem() {
            const inp = document.getElementById('itemInput');
            const text = inp.value.trim();
            if (!text) { inp.focus(); return; }
            const cat = document.getElementById('catSelect').value;
            items.push({ text, cat, done: false });
            inp.value = '';
            inp.focus();
            save(); render();
            toast('تمت الإضافة ✓');
        }

        function toggle(i) { items[i].done = !items[i].done; save(); render(); }

        function delItem(i) {
            if (confirm(`حذف "${items[i].text}"؟`)) {
                items.splice(i, 1);
                save(); render();
                toast('تم الحذف 🗑️');
            }
        }

        function editItem(i) {
            const newText = prompt('عدّل العنصر:', items[i].text);
            if (newText !== null && newText.trim()) {
                items[i].text = newText.trim();
                save(); render();
                toast('تم التعديل ✓');
            }
        }

        function updateInline(i, val) {
            if (val.trim()) { items[i].text = val.trim(); save(); render(); }
        }

        function setCatFilter(c, el) {
            catFilter = c;
            document.querySelectorAll('.chip').forEach(ch => ch.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function toggleEditMode() {
            editMode = !editMode;
            const b = document.getElementById('editModeBtn');
            b.classList.toggle('active', editMode);
            render();
        }

        function clearDone() {
            const n = items.filter(i => i.done).length;
            if (!n) { toast('لا يوجد مكتمل لمسحه'); return; }
            if (confirm(`مسح ${n} عنصر مكتمل؟`)) {
                items = items.filter(i => !i.done);
                save(); render();
                toast('تم المسح ✓');
            }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'lattakia-list.json';
            a.click();
            URL.revokeObjectURL(a.href);
            toast('تم التصدير 📁');
        }

        function importData() {
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.accept = 'application/json';
            inp.onchange = e => {
                const f = e.target.files[0];
                if (!f) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const data = JSON.parse(reader.result);
                        if (!Array.isArray(data)) throw new Error('bad');
                        items = data.map(i => ({ text: String(i.text || ''), cat: i.cat || 'عام', done: !!i.done })).filter(i => i.text);
                        save(); render();
                        toast('تم الاستيراد ✓');
                    } catch (err) { toast('ملف غير صالح!'); }
                };
                reader.readAsText(f);
            };
            inp.click();
        }

        render();
    </script>
</body>
</html>
